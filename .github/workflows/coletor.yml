name: Coletar agenda esportiva

on:
  schedule:
    # Horarios em UTC. Brasilia = UTC-3.
    - cron: "0 9 * * *"    # 06:00 BRT
    - cron: "0 20 * * *"   # 17:00 BRT
    - cron: "0 23 * * *"   # 20:00 BRT
  workflow_dispatch:        # botao para rodar na mao

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Tesseract (com portugues)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o coletor
        run: python coletor.py

      - name: Guardar os arquivos de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar o JSON
        run: |
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add docs/app.json
          if git diff --staged --quiet; then
            echo "Nada mudou desde a ultima execucao."
          else
            git commit -m "agenda atualizada em $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git push
          fi
