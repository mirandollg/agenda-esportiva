name: Coletar agenda esportiva

on:
  schedule:
    # Horarios em UTC. Brasilia = UTC-3.
    # De meia em meia hora, das 06h as 23h30 de Brasilia.
    - cron: "*/30 9-23 * * *"    # 06:00 as 20:30 BRT
    - cron: "*/30 0-2 * * *"     # 21:00 as 23:30 BRT
  workflow_dispatch:              # botao para rodar na mao

permissions:
  contents: write

# Se uma execucao agendada pegar outra ainda rodando, a nova espera.
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Tesseract (com portugues)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar o coletor
        run: python coletor.py

      - name: Publicar o JSON e o debug
        if: always()
        run: |
          set -e
          git config user.name "coletor"
          git config user.email "coletor@users.noreply.github.com"

          # docs/app.json e debug/* sao arquivos GERADOS. Nao faz sentido
          # tentar mesclar: a versao recem-produzida sempre vence. Por isso
          # guardamos o resultado, alinhamos com o remoto e reaplicamos por
          # cima, em vez de usar pull --rebase (que trava em conflito).
          guardado=$(mktemp -d)
          mkdir -p docs debug
          cp -a docs "$guardado/docs"
          cp -a debug "$guardado/debug"

          for tentativa in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            mkdir -p docs debug
            cp -a "$guardado/docs/." docs/
            cp -a "$guardado/debug/." debug/

            git add -A docs debug
            if git diff --staged --quiet; then
              echo "Nada mudou desde a ultima execucao."
              exit 0
            fi

            git commit -m "agenda atualizada em $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            if git push; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi

            echo "Alguem commitou antes. Realinhando e tentando de novo."
            sleep 5
          done

          echo "Nao consegui publicar depois de 3 tentativas."
          exit 1
